# Same as vlnce_task.yaml plus an agent-mounted downward RGB sensor for textured
# overhead views. Use as BASE_TASK_CONFIG_PATH for eval/visualization; keep
# vlnce_task.yaml for IL training if policies assume only rgb + depth.
#
# OVERHEAD_RGB_SENSOR pose (agent body frame, +Y up): POSITION lifts the camera
# above the agent; ORIENTATION is Euler [pitch, yaw, roll] in radians. Here
# pitch=-pi/2 makes the camera look toward -Y (floor). Tune if needed.

ENVIRONMENT:
  MAX_EPISODE_STEPS: 20
SIMULATOR:
  ACTION_SPACE_CONFIG: v0
  AGENT_0:
    SENSORS: [RGB_SENSOR, DEPTH_SENSOR, OVERHEAD_RGB_SENSOR]
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 15
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: True
  RGB_SENSOR:
    WIDTH: 224
    HEIGHT: 224
    HFOV: 90
    TYPE: HabitatSimRGBSensor
  DEPTH_SENSOR:
    WIDTH: 256
    HEIGHT: 256
    HFOV: 90
  OVERHEAD_RGB_SENSOR:
    TYPE: HabitatSimRGBSensor
    WIDTH: 512
    HEIGHT: 512
    HFOV: 90
    POSITION: [0, 2.5, 0]
    ORIENTATION: [-1.5707963267948966, 0.0, 0.0]
  TYPE:
    Sim-v1
TASK:
  TYPE: VLN-v0
  SUCCESS_DISTANCE: 3.0
  SENSORS: [
    INSTRUCTION_SENSOR,
    SHORTEST_PATH_SENSOR,
    VLN_ORACLE_PROGRESS_SENSOR
  ]
  INSTRUCTION_SENSOR_UUID: instruction
  POSSIBLE_ACTIONS: [STOP, MOVE_FORWARD, TURN_LEFT, TURN_RIGHT, HIGHTOLOW]
  MEASUREMENTS: []
  SUCCESS:
    SUCCESS_DISTANCE: 3.0
  SPL:
    SUCCESS_DISTANCE: 3.0
  NDTW:
    SUCCESS_DISTANCE: 3.0
    GT_PATH: data/datasets/R2R_VLNCE_v1-2_preprocessed/{split}/{split}_gt.json.gz
  SDTW:
    SUCCESS_DISTANCE: 3.0
    GT_PATH: data/datasets/R2R_VLNCE_v1-2_preprocessed/{split}/{split}_gt.json.gz
  ORACLE_SUCCESS:
    SUCCESS_DISTANCE: 3.0
DATASET:
  TYPE: VLN-CE-v1
  SPLIT: val_unseen
  DATA_PATH: data/datasets/R2R_VLNCE_v1-2_preprocessed/{split}/OpenNav_R2R-CE_100_bertidx.json.gz
  SCENES_DIR: data/scene_datasets/
  EPISODES_TO_LOAD: 1
