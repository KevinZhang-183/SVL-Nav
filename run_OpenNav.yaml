BASE_TASK_CONFIG_PATH: habitat_extensions/config/vlnce_task.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
TRAINER_NAME: schedulesampler-OPENNAV
GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
CHECKPOINT_FOLDER: logs/checkpoints/
EVAL_CKPT_PATH_DIR: logs/checkpoints/
RESULTS_DIR: logs/eval_results/

NAV_VIS:
  ENABLE_OVERHEAD_RGB: False
  ENABLE_TOPDOWN_MAP: True
  ENABLE_TEXTURE_TOPDOWN: False
  SAVE_MOSAIC: True
  TEXTURE_CACHE_DIR: cache/topdown_texture
  TEXTURE_RESOLUTION: 2048

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  EPISODE_COUNT: -1 # 真实上限仍然由上面的 EPISODES_TO_LOAD 决定，EPISODE_COUNT 只是“在这些 loaded episodes 里最多跑多少”。

MODEL:
  policy_name: PolicyViewSelectionCMA
  spatial_output: False
  RGB_ENCODER:
    encode_size: 2048
    output_size: 512
  DEPTH_ENCODER:
    encode_size: 128
    output_size: 256
    ddppo_checkpoint: data/pretrained_models/ddppo-models/gibson-2plus-resnet50.pth
  VISUAL_DIM:
    vis_hidden: 512
    directional: 64
  INSTRUCTION_ENCODER:
    bidirectional: True
    use_pretrained_embeddings: False
    embedding_size: 256
    hidden_size: 256

